name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'portfolio/**'
      - 'algorithm-builder/**'
      - 'launch-check/**'
      - 'heardle-test/**'
      - 'inside-jokes/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
  # Weekly rebuild so Algorithm Builder's "good channel" videos stay fresh.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            portfolio/package-lock.json
            algorithm-builder/package-lock.json

      - run: npm ci
      - run: npm run build

      # Algorithm Builder ships inside the same Pages site at
      # /SeanJoudrie/algorithm-builder/. Its build uses a relative base, and
      # with no search server on Pages the playlist uses YouTube search links.
      - name: Build Algorithm Builder
        working-directory: algorithm-builder
        env:
          VITE_SEARCH_API: 'off'
        run: |
          npm ci
          # Latest uploads from its good channels (public feeds, no key).
          # Never fails the build: a channel that can't be read keeps its
          # last saved videos. The whole refresh is capped at 3 minutes.
          timeout 180 node scripts/feeds.mjs || echo "Feed refresh skipped; using saved videos."
          npm test
          npm run build
      - run: cp -r ../algorithm-builder/dist dist/algorithm-builder

      # Launch Check is plain HTML/CSS/JS with no build step; it ships at
      # /SeanJoudrie/launch-check/.
      - name: Add Launch Check
        run: |
          mkdir -p dist/launch-check
          cp ../launch-check/index.html ../launch-check/styles.css ../launch-check/app.js ../launch-check/motion.js ../launch-check/data.js ../launch-check/config.js ../launch-check/favicon.svg ../launch-check/og.png ../launch-check/sources.html dist/launch-check/
          # Stamp asset links with the commit so browsers never pair a new
          # page with a cached old script.
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" dist/launch-check/index.html dist/launch-check/sources.html

      # Song Guess is plain HTML/CSS/JS; it ships at
      # /SeanJoudrie/heardle-test/, the redirect URI saved in the Spotify app.
      - name: Add Song Guess
        run: |
          mkdir -p dist/heardle-test
          cp ../heardle-test/index.html ../heardle-test/styles.css ../heardle-test/spotify.js ../heardle-test/clips.js ../heardle-test/reserves.js ../heardle-test/imports.js ../heardle-test/ui.js ../heardle-test/app.js ../heardle-test/favicon.svg ../heardle-test/og.png dist/heardle-test/
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" dist/heardle-test/index.html

      # Inside Jokes is plain HTML/CSS/JS; it ships at /SeanJoudrie/inside-jokes/.
      - name: Add Inside Jokes
        run: |
          mkdir -p dist/inside-jokes
          cp ../inside-jokes/index.html ../inside-jokes/styles.css ../inside-jokes/game.js ../inside-jokes/puzzles.js ../inside-jokes/app.js ../inside-jokes/favicon.svg ../inside-jokes/og.png dist/inside-jokes/
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" dist/inside-jokes/index.html

      # Each friend group's puzzle gets its own page: the same game with only
      # that group's puzzle file, so no page holds another group's puzzle.
      # /inside-jokes/ stays SNHU's; Wakefield's is /wakefield/.
      - name: Add Wakefield edition
        run: |
          mkdir -p dist/wakefield
          cp dist/inside-jokes/index.html dist/inside-jokes/styles.css dist/inside-jokes/game.js dist/inside-jokes/app.js dist/inside-jokes/favicon.svg dist/inside-jokes/og.png dist/wakefield/
          cp ../inside-jokes/editions/wakefield.js dist/wakefield/puzzles.js
          sed -i "s#/inside-jokes/#/wakefield/#g" dist/wakefield/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages publish occasionally exceeds the 10-min default and aborts
          # with "Timeout reached, aborting!"; give it more headroom.
          timeout: 900000
