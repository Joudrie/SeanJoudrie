name: Inside Jokes tests

on:
  pull_request:
    paths:
      - 'inside-jokes/**'
      - '.github/workflows/inside-jokes-tests.yml'
  push:
    branches: [main]
    paths:
      - 'inside-jokes/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inside-jokes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
